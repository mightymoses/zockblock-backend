[project]
name = "zockblock-backend"
version = "0.1.0"
description = "Backend for the zockblock app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "auth0-fastapi-api>=1.0.0b7",
    "fastapi[standard]>=0.136.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]
