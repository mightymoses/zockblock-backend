services:

  db:
    image: postgres:18
    container_name: zockblock-postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

  adminer:
    image: adminer
    container_name: zockblock-adminer
    restart: unless-stopped
    ports:
      - 8080:8080
