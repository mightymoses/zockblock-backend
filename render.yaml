databases:
  - name: zockblock-postgres
    region: frankfurt
    plan: basic-256mb

services:
  - name: zockblock-backend
    type: web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zockblock-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_API_AUDIENCE
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
